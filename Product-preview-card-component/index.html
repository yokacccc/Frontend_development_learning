<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->

        <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

        <title>Frontend Mentor | Product preview card component</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="preload" as="image" href="images/image-product-mobile.jpg" />
        <link rel="preload" as="image" href="images/image-product-desktop.jpg" />
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <main>
            <article class="product-card">
                <header class="header-image">
                    <picture>
                        <source
                            media="(min-width: 1440px)"
                            srcset="images/image-product-desktop.jpg"
                        />
                        <img
                            src="images/image-product-mobile.jpg"
                            alt="A bottle of Gabrielle Essence Eau De Parfum perfume"
                        />
                    </picture>
                </header>
                <section class="product-info">
                    <div class="text-content">
                        <span>Perfume</span>
                        <h1>Gabrielle Essence Eau De Parfum</h1>
                        <p>
                            A floral, solar and voluptuous interpretation composed by Olivier Polge,
                            Perfumer-Creator for the House of CHANEL.
                        </p>
                    </div>
                    <div class="price-info">
                        <span>$149.99</span>
                        <span>$169.99</span>
                    </div>

                    <button class="add-to-cart-btn">
                        <img src="images/icon-cart.svg" alt="A cart icon" />
                        Add to Cart
                    </button>
                </section>
            </article>
        </main>
    </body>
</html>
