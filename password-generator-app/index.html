<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />

        <title>Password generator app</title>
    </head>
    <body>
        <header class="header-text">
            <p>Password Generator</p>
        </header>
        <main class="container">
            <!-- 显示密码 -->
            <div class="password-display">
                <input type="text" id="password" readonly placeholder="P4$5W0rD!" />
                <div class="password-display-btn">
                    <span class="password__copied-text">COPIED</span>
                    <button class="password__copy-btn">
                        <svg width="21" height="24" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M20.341 3.091 17.909.659A2.25 2.25 0 0 0 16.319 0H8.25A2.25 2.25 0 0 0 6 2.25V4.5H2.25A2.25 2.25 0 0 0 0 6.75v15A2.25 2.25 0 0 0 2.25 24h10.5A2.25 2.25 0 0 0 15 21.75V19.5h3.75A2.25 2.25 0 0 0 21 17.25V4.682a2.25 2.25 0 0 0-.659-1.591ZM12.469 21.75H2.53a.281.281 0 0 1-.281-.281V7.03a.281.281 0 0 1 .281-.281H6v10.5a2.25 2.25 0 0 0 2.25 2.25h4.5v1.969a.282.282 0 0 1-.281.281Zm6-4.5H8.53a.281.281 0 0 1-.281-.281V2.53a.281.281 0 0 1 .281-.281H13.5v4.125c0 .621.504 1.125 1.125 1.125h4.125v9.469a.282.282 0 0 1-.281.281Zm.281-12h-3v-3h.451c.075 0 .147.03.2.082L18.667 4.6a.283.283 0 0 1 .082.199v.451Z"
                                fill="currentColor"
                            />
                        </svg>
                    </button>
                </div>
            </div>
            <!-- 选项设置 -->
            <div class="password__options-container">
                <div class="password__slider-container">
                    <div>
                        <p>Character Length</p>
                        <span class="password__length-value">8</span>
                    </div>
                    <input
                        type="range"
                        id="range"
                        class="password__slider"
                        name="range-length"
                        min="0"
                        max="16"
                        value="8"
                    />
                </div>
                <div class="password__checkbox-container">
                    <div>
                        <input
                            type="checkbox"
                            name="option"
                            id="uppercase-option"
                            class="password__checkbox"
                        />
                        <label for="uppercase-option" class="password__checkbox-text"
                            >Include Uppercase Letters</label
                        >
                    </div>
                    <div>
                        <input
                            type="checkbox"
                            name="option"
                            id="lowercase-option"
                            class="password__checkbox"
                        />
                        <label for="lowercase-option" class="password__checkbox-text"
                            >Include Lowercase Letters</label
                        >
                    </div>
                    <div>
                        <input
                            type="checkbox"
                            name="option"
                            id="number-option"
                            class="password__checkbox"
                        />
                        <label for="number-option" class="password__checkbox-text"
                            >Include Numbers</label
                        >
                    </div>
                    <div>
                        <input
                            type="checkbox"
                            name="option"
                            id="symbols-option"
                            class="password__checkbox"
                        />
                        <label for="symbols-option" class="password__checkbox-text"
                            >Include Symbols</label
                        >
                    </div>
                </div>
                <div class="password__strength-container">
                    <div class="password__strength-display">
                        <span class="password__strength-label">STRENGTH</span>
                        <div class="password__strength">
                            <span class="password__strength-text">MEDIUM</span>
                            <div class="password__strength-bars">
                                <span class="bar"></span>
                                <span class="bar"></span>
                                <span class="bar"></span>
                                <span class="bar"></span>
                            </div>
                        </div>
                    </div>
                    <button class="password-return-btn">
                        <span>GENERATE</span>
                        <svg width="12" height="12" xmlns="http://www.w3.org/2000/svg">
                            <path
                                fill="currentColor"
                                d="m5.106 12 6-6-6-6-1.265 1.265 3.841 3.84H.001v1.79h7.681l-3.841 3.84z"
                            />
                        </svg>
                    </button>
                </div>
            </div>
        </main>

        <script src="index.js"></script>
    </body>
</html>
