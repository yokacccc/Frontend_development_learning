<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->

        <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="style.css" />
        <title>Time tracking dashboard</title>
    </head>
    <body>
        <main class="container">
            <article class="user-primary">
                <div class="user-primary__profile">
                    <div class="user-primary__profile-image">
                        <img src="./images/image-jeremy.png" alt="user image" />
                    </div>
                    <div class="user-primary__profile-text">
                        <p>Report for</p>
                        <h1>Jeremy Robson</h1>
                    </div>
                </div>
                <div class="user-primary__time-control">
                    <button class="user-primary__daily-control">Daily</button>
                    <button class="user-primary__weekly-control">Weekly</button>
                    <button class="user-primary__monthly-control">Monthly</button>
                </div>
            </article>

            <div class="card-control">
                <article class="card__work">
                    <div class="card__main-section">
                        <div class="card__header">
                            <p class="card__title">Work</p>
                            <button class="card__ellipsis">
                                <img src="./images/icon-ellipsis.svg" alt="展开符号" />
                            </button>
                        </div>
                        <div class="card__stats">
                            <h2 class="current">32hrs</h2>
                            <p class="previous">Last Week - 36hrs</p>
                        </div>
                    </div>
                </article>

                <article class="card__play">
                    <div class="card__main-section">
                        <div class="card__header">
                            <p class="card__title">Play</p>
                            <button class="card__ellipsis">
                                <img src="./images/icon-ellipsis.svg" alt="展开符号" />
                            </button>
                        </div>
                        <div class="card__stats">
                            <h2 class="current">10hrs</h2>
                            <p class="previous">Last Week - 36hrs</p>
                        </div>
                    </div>
                </article>

                <article class="card__study">
                    <div class="card__main-section">
                        <div class="card__header">
                            <p class="card__title">Study</p>
                            <button class="card__ellipsis">
                                <img src="./images/icon-ellipsis.svg" alt="展开符号" />
                            </button>
                        </div>
                        <div class="card__stats">
                            <h2 class="current">4hrs</h2>
                            <p class="previous">Last Week - 7hrs</p>
                        </div>
                    </div>
                </article>

                <article class="card__exercise">
                    <div class="card__main-section">
                        <div class="card__header">
                            <p class="card__title">Exercise</p>
                            <button class="card__ellipsis">
                                <img src="./images/icon-ellipsis.svg" alt="展开符号" />
                            </button>
                        </div>
                        <div class="card__stats">
                            <h2 class="current">4hrs</h2>
                            <p class="previous">Last Week - 5hrs</p>
                        </div>
                    </div>
                </article>

                <article class="card__social">
                    <div class="card__main-section">
                        <div class="card__header">
                            <p class="card__title">Social</p>
                            <button class="card__ellipsis">
                                <img src="./images/icon-ellipsis.svg" alt="展开符号" />
                            </button>
                        </div>
                        <div class="card__stats">
                            <h2 class="current">5hrs</h2>
                            <p class="previous">Last Week - 10hrs</p>
                        </div>
                    </div>
                </article>

                <article class="card__self-care">
                    <div class="card__main-section">
                        <div class="card__header">
                            <p class="card__title">Self Care</p>
                            <button class="card__ellipsis">
                                <img src="./images/icon-ellipsis.svg" alt="展开符号" />
                            </button>
                        </div>
                        <div class="card__stats">
                            <h2 class="current">2hrs</h2>
                            <p class="previous">Last Week - 2hrs</p>
                        </div>
                    </div>
                </article>
            </div>
        </main>

        <script src="index.js"></script>
    </body>
</html>
